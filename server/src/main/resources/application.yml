server:
  port: 8080

spring:
  application:
    name: agenttrail-server
  # Default profile: H2 in-memory, zero-config dev. Flyway runs V1__init.sql here too.
  datasource:
    url: jdbc:h2:mem:agenttrail;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

agenttrail:
  version: 0.1.0
  api-key: ${AGENTTRAIL_API_KEY:dev-key}

---
spring:
  config:
    activate:
      on-profile: prod
  # Prod profile: PostgreSQL via environment variables.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
