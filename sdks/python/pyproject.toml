[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrail"
version = "0.1.0"
description = "Python SDK for AgentTrail — flight recorder for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AgentTrail" }]

[project.urls]
Homepage = "https://github.com/agenttrail/agenttrail"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenttrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
