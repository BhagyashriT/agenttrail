name: mcp

on:
  push:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify -f mcp/pom.xml
